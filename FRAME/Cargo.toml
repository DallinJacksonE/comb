[package]
name = "comb-frame"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "comb_frame"

[[bin]]
name = "comb"
path = "src/main.rs"

[dependencies]
comb-cell = { path = "../CELL" }
comb-guard = { path = "../GUARD" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
hex.workspace = true
rand.workspace = true
sha2.workspace = true
zeroize.workspace = true
tempfile.workspace = true
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["fs", "limit", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
tar = "0.4"
rpassword = "7"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
rand10 = { package = "rand", version = "0.10" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

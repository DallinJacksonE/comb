[workspace]
members = ["CELL", "FRAME", "GUARD"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
